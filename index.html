<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현장 관리 · WeatherWorks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- 좌측 사이드바 (nav.js에서 자동 렌더링) -->
    <aside class="sidebar"></aside>

    <!-- 우측 메인 영역 -->
    <main class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <span class="top-bar-title">현장 관리</span>
        </div>
        <div class="top-bar-right">
          <button class="btn btn-primary" onclick="alert('현장 추가 기능 준비 중')">+ 현장 추가</button>
        </div>
      </header>

      <div class="content-container">
        <div class="page-title-area">
          <h2 class="page-title">현장 관리</h2>
          <p class="page-desc">현장을 등록하고 기간·관측지점·적용 공종을 설정합니다.</p>
        </div>

        <div class="card">
          <div class="card-body">
            <table class="data-table">
              <thead>
                <tr>
                  <th>현장명</th>
                  <th>위치</th>
                  <th>기간</th>
                  <th>관측지점</th>
                  <th>비고</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>OO지구 공동주택 신축공사</strong></td>
                  <td>충남 아산시 배방읍</td>
                  <td>2024-03-01 ~ 2026-08-31</td>
                  <td>아산(637) / 천안(232)</td>
                  <td><span class="badge badge-success">진행중</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/sw-catalog.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
